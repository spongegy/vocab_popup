<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뜻밖의 뜻 — 어휘 도우미 리더</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #f4f4f2;
  --surface:  #eeede9;
  --border:   #d6d4ce;
  --border2:  #c4c2bb;
  --text:     #1c1c1a;
  --text2:    #5a5a56;
  --text3:    #9a9890;
  --accent:   #1c1c1a;
  --tag-a:    #2d6a4f;
  --tag-b:    #b45309;
  --tag-c:    #9b1c1c;
  --ul-a:     rgba(45,106,79,0.55);
  --ul-b:     rgba(180,83,9,0.55);
  --ul-c:     rgba(155,28,28,0.7);
  --popup-bg: #1e1e1c;
  --popup-border: #333330;
  --radius:   6px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
}

/* ── 헤더 ── */
.header {
  background: var(--text);
  color: #f4f4f2;
  padding: 0 28px;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 20px;
  border-bottom: 1px solid #333;
}
.header-logo {
  font-family: 'Noto Serif KR', serif;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.header-logo span { color: #a0a09a; font-weight: 300; margin: 0 4px; }
.header-divider { width: 1px; height: 16px; background: #444; }
.header-desc { font-size: 11px; color: #888; font-weight: 300; }
.server-pill {
  margin-left: auto;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  padding: 3px 10px;
  border-radius: 20px;
  border: 1px solid;
  white-space: nowrap;
}
.pill-ok  { color: #6ee7b7; border-color: rgba(110,231,183,0.3); background: rgba(110,231,183,0.08); }
.pill-err { color: #fca5a5; border-color: rgba(252,165,165,0.3); background: rgba(252,165,165,0.08); }
.pill-chk { color: #fcd34d; border-color: rgba(252,211,77,0.3);  background: rgba(252,211,77,0.08); }

/* ── 탭 ── */
.tabs {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  display: flex;
  gap: 0;
}
.tab {
  font-size: 12px;
  font-weight: 400;
  padding: 10px 16px;
  cursor: pointer;
  color: var(--text3);
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
  user-select: none;
}
.tab.active { color: var(--text); border-bottom-color: var(--text); }
.tab:hover:not(.active) { color: var(--text2); }

/* ── 레이아웃 ── */
.body { display: flex; height: calc(100vh - 91px); }

/* ── 사이드바 ── */
.sidebar {
  width: 210px;
  min-width: 210px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  overflow-y: auto;
}
.section-label {
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 8px;
}

.upload-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  border: 1px dashed var(--border2);
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 11px;
  color: var(--text2);
  background: var(--bg);
  transition: all 0.15s;
  font-family: 'Noto Sans KR', sans-serif;
}
.upload-btn:hover { border-color: var(--text2); color: var(--text); background: var(--border); }
.upload-btn svg { flex-shrink: 0; opacity: 0.5; }
#fileInput { display: none; }

.grade-list { display: flex; flex-direction: column; gap: 6px; }
.grade-row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text2); }
.grade-pip { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.pip-a { background: var(--tag-a); }
.pip-b { background: var(--tag-b); }
.pip-c { background: var(--tag-c); }
.pip-u { background: var(--border2); }

.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.stat-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 10px;
}
.stat-card-label { font-size: 9px; color: var(--text3); margin-bottom: 3px; letter-spacing: 0.05em; }
.stat-card-val { font-family: 'DM Mono', monospace; font-size: 16px; font-weight: 500; color: var(--text); }
.stat-card.full { grid-column: 1/-1; }

.how-list { display: flex; flex-direction: column; gap: 8px; }
.how-row { display: flex; gap: 8px; align-items: flex-start; font-size: 11px; color: var(--text2); line-height: 1.5; }
.how-n {
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--text); color: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 8px; flex-shrink: 0; margin-top: 1px;
  font-family: 'DM Mono', monospace;
}

/* ── 리더 패널 ── */
.reader { flex: 1; overflow-y: auto; padding: 40px 64px; }
.tab-content { display: none; }
.tab-content.active { display: block; }

#textInput {
  width: 100%;
  min-height: 160px;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-family: 'Noto Serif KR', serif;
  font-size: 16px;
  line-height: 1.9;
  background: white;
  color: var(--text);
  resize: vertical;
  margin-bottom: 14px;
  outline: none;
  transition: border-color 0.15s;
}
#textInput:focus { border-color: var(--text2); }

.btn-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.btn-primary {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 12px;
  font-weight: 500;
  background: var(--text);
  color: var(--bg);
  border: none;
  border-radius: var(--radius);
  padding: 9px 20px;
  cursor: pointer;
  transition: opacity 0.15s;
  letter-spacing: 0.02em;
}
.btn-primary:hover { opacity: 0.8; }
.hint-text { font-size: 11px; color: var(--text3); line-height: 1.7; }

/* ── 읽기 모드 ── */
.toggle-row { display: flex; gap: 6px; margin-bottom: 28px; flex-wrap: wrap; }
.grade-toggle {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; cursor: pointer;
  padding: 4px 10px; border-radius: 20px;
  border: 1px solid var(--border);
  background: white;
  transition: all 0.15s; user-select: none;
  color: var(--text2);
}
.grade-toggle.on-a { background: rgba(45,106,79,0.08); border-color: rgba(45,106,79,0.4); color: var(--tag-a); }
.grade-toggle.on-b { background: rgba(180,83,9,0.08);  border-color: rgba(180,83,9,0.4);  color: var(--tag-b); }
.grade-toggle.on-c { background: rgba(155,28,28,0.08); border-color: rgba(155,28,28,0.4); color: var(--tag-c); }

.reading-text {
  font-family: 'Noto Serif KR', serif;
  font-size: 18px;
  line-height: 2.2;
  color: var(--text);
  max-width: 680px;
  word-break: keep-all;
}

.word-token {
  cursor: pointer;
  display: inline;
  padding: 1px 0;
  border-radius: 2px;
  transition: background 0.12s;
}
.word-token:hover { background: rgba(0,0,0,0.06); }
.word-token.grade-초급 { border-bottom: 1.5px solid var(--ul-a); }
.word-token.grade-중급 { border-bottom: 1.5px solid var(--ul-b); }
.word-token.grade-고급 { border-bottom: 1.5px solid var(--ul-c); }
.word-token.grade-loading { border-bottom: 1.5px dotted var(--border2); }
.word-token.hl { background: rgba(0,0,0,0.07) !important; }
.josa { display: inline; color: var(--text2); }

/* ── 팝업 ── */
#popup {
  display: none;
  position: fixed;
  z-index: 9999;
  background: var(--popup-bg);
  color: #e8e8e4;
  border-radius: 8px;
  padding: 16px 18px;
  min-width: 240px;
  max-width: 320px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.35), 0 2px 8px rgba(0,0,0,0.2);
  border: 1px solid var(--popup-border);
  font-family: 'Noto Sans KR', sans-serif;
}
.popup-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
.popup-word { font-family: 'Noto Serif KR', serif; font-size: 20px; font-weight: 500; color: #f4f4f2; line-height: 1.2; }
.popup-meta { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.popup-grade {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  padding: 2px 7px;
  border-radius: 10px;
  letter-spacing: 0.05em;
  font-weight: 500;
}
.g-초급 { background: rgba(45,106,79,0.2);  color: #6ee7b7; border: 1px solid rgba(45,106,79,0.4); }
.g-중급 { background: rgba(180,83,9,0.2);   color: #fbbf24; border: 1px solid rgba(180,83,9,0.4); }
.g-고급 { background: rgba(155,28,28,0.2);  color: #fca5a5; border: 1px solid rgba(155,28,28,0.4); }
.g-unknown { background: rgba(150,150,150,0.15); color: #888; border: 1px solid rgba(150,150,150,0.3); }
.g-loading { background: rgba(150,150,150,0.1);  color: #666; border: 1px solid rgba(150,150,150,0.2); }
.popup-pos { font-size: 10px; color: #666; }
.popup-close { background: none; border: none; color: #555; cursor: pointer; font-size: 14px; padding: 2px; line-height: 1; flex-shrink: 0; transition: color 0.12s; }
.popup-close:hover { color: #f4f4f2; }
.popup-body { border-top: 1px solid #2e2e2c; padding-top: 10px; }
.sense { margin-bottom: 10px; }
.sense:last-child { margin-bottom: 0; }
.sense-n { font-family: 'DM Mono', monospace; font-size: 9px; color: #555; margin-bottom: 3px; }
.sense-def { font-size: 12.5px; line-height: 1.7; color: #d0d0cc; }
.sense-ex { font-size: 11px; color: #777; margin-top: 5px; line-height: 1.6; }
.sense-ex::before { content: '예) '; color: #555; }

.spinner {
  display: inline-block; width: 10px; height: 10px;
  border: 1.5px solid #444; border-top-color: #aaa;
  border-radius: 50%; animation: spin 0.6s linear infinite;
  vertical-align: middle; margin-right: 5px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header class="header">
  <div class="header-logo">뜻밖의 뜻<span>/</span>어휘 도우미</div>
  <div class="header-divider"></div>
  <div class="header-desc">읽는 그 순간, 뜻이 뜬다</div>
  <div class="server-pill pill-chk" id="serverPill">● 연결 확인 중</div>
</header>

<nav class="tabs">
  <div class="tab active" onclick="switchTab('input')">텍스트 입력</div>
  <div class="tab" onclick="switchTab('read')">읽기 모드</div>
</nav>

<div class="body">
  <aside class="sidebar">

    <div>
      <div class="section-label">파일 열기</div>
      <div class="upload-btn" onclick="document.getElementById('fileInput').click()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
        PDF / TXT 업로드
      </div>
      <input type="file" id="fileInput" accept=".pdf,.txt">
    </div>

    <div>
      <div class="section-label">어휘 등급</div>
      <div class="grade-list">
        <div class="grade-row"><div class="grade-pip pip-a"></div>초급</div>
        <div class="grade-row"><div class="grade-pip pip-b"></div>중급</div>
        <div class="grade-row"><div class="grade-pip pip-c"></div>고급</div>
        <div class="grade-row"><div class="grade-pip pip-u"></div>미분류</div>
      </div>
    </div>

    <div>
      <div class="section-label">어휘 통계</div>
      <div class="stats-grid">
        <div class="stat-card full">
          <div class="stat-card-label">전체 어절</div>
          <div class="stat-card-val" id="s-total">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">초급</div>
          <div class="stat-card-val" id="s-a">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">중급</div>
          <div class="stat-card-val" id="s-b">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">고급</div>
          <div class="stat-card-val" id="s-c">—</div>
        </div>
      </div>
    </div>

    <div>
      <div class="section-label">사용 방법</div>
      <div class="how-list">
        <div class="how-row"><div class="how-n">1</div>텍스트 붙여넣기 또는 PDF 업로드</div>
        <div class="how-row"><div class="how-n">2</div>분석 시작 → 읽기 모드</div>
        <div class="how-row"><div class="how-n">3</div>단어 클릭 → 뜻 팝업</div>
        <div class="how-row"><div class="how-n">4</div>조사 자동 분리<br>(돌연사에 → 돌연사+에)</div>
      </div>
    </div>

  </aside>

  <main class="reader">
    <div class="tab-content active" id="tab-input">
      <textarea id="textInput" placeholder="여기에 읽을 글을 붙여넣어 주세요.

예시) 인공지능은 인간의 지능을 모방하여 학습, 추론, 인식 등의 기능을 수행하는 컴퓨터 시스템이다. 최근 딥러닝 기술의 발전으로 다양한 분야에서 눈부신 성과를 거두고 있다. 돌연사에 이르는 심근경색을 예방하려면 규칙적인 생활습관이 중요하다."></textarea>
      <div class="btn-row">
        <button class="btn-primary" onclick="analyzeText()">분석 시작 →</button>
      </div>
      <div class="hint-text">
        단어 클릭 시 국립국어원 한국어기초사전에서 뜻을 실시간으로 가져옵니다.<br>
        조사·어미가 붙은 단어도 자동으로 분리됩니다.
      </div>
    </div>

    <div class="tab-content" id="tab-read">
      <div class="toggle-row">
        <div class="grade-toggle on-a" id="tg-a" onclick="toggleGrade('a','초급')">
          <div class="grade-pip pip-a"></div>초급
        </div>
        <div class="grade-toggle on-b" id="tg-b" onclick="toggleGrade('b','중급')">
          <div class="grade-pip pip-b"></div>중급
        </div>
        <div class="grade-toggle on-c" id="tg-c" onclick="toggleGrade('c','고급')">
          <div class="grade-pip pip-c"></div>고급
        </div>
      </div>
      <div class="reading-text" id="readingText"></div>
    </div>
  </main>
</div>

<div id="popup">
  <div class="popup-top">
    <div>
      <div class="popup-word" id="p-word"></div>
      <div class="popup-meta">
        <span class="popup-grade" id="p-grade"></span>
        <span class="popup-pos" id="p-pos"></span>
      </div>
    </div>
    <button class="popup-close" onclick="closePopup()">✕</button>
  </div>
  <div class="popup-body" id="p-body"></div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const SERVER = (location.hostname==='localhost'||location.hostname==='127.0.0.1') ? 'http://localhost:5000' : '';
const cache = {};

async function checkServer() {
  const pill = document.getElementById('serverPill');
  try {
    const r = await fetch(`${SERVER}/api/dict?q=나무`, { signal: AbortSignal.timeout(4000) });
    if (r.ok) { pill.textContent='● 사전 연결됨'; pill.className='server-pill pill-ok'; }
    else throw new Error();
  } catch { pill.textContent='● 사전 연결 실패'; pill.className='server-pill pill-err'; }
}
checkServer();

async function fetchDict(word) {
  if (cache[word]!==undefined) return cache[word];
  try {
    const r = await fetch(`${SERVER}/api/dict?q=${encodeURIComponent(word)}`, { signal: AbortSignal.timeout(8000) });
    if (!r.ok) { cache[word]=null; return null; }
    const xml = new DOMParser().parseFromString(await r.text(), 'text/xml');
    if (xml.querySelector('parsererror')||xml.querySelector('error')) { cache[word]=null; return null; }
    const items = xml.querySelectorAll('item');
    if (!items.length) { cache[word]=null; return null; }
    const first = items[0];
    const grade = first.querySelector('word_grade')?.textContent?.trim()||'';
    const pos   = first.querySelector('pos')?.textContent?.trim()||'';
    const senses=[];
    xml.querySelectorAll('sense').forEach(s=>{
      const def=s.querySelector('definition')?.textContent?.trim()||'';
      const ex =s.querySelector('example')?.textContent?.trim()||'';
      if (def) senses.push({def,ex});
    });
    cache[word]={grade,pos,senses};
    return cache[word];
  } catch { cache[word]=null; return null; }
}

const JOSA=['으로부터는','으로부터도','로부터는','로부터도','으로부터','로부터','에서부터','에게서','한테서','으로서는','으로서도','로서는','로서도','으로서','로서','에서는','에서도','에서가','에서만','에게는','에게도','에게만','한테는','한테도','이라도','라도','이라면','라면','이라고','라고','이니까','니까','이지만','지만','이므로','므로','으로는','으로도','으로만','로는','로도','로만','이라는','라는','이란','란','에서','에게','한테','에는','에도','에만','부터','까지','마다','조차','마저','밖에','이라','이야','이랑','랑','으로','로','의','과','와','은','는','이','가','을','를','도','만','에','께','서','야','아'];
const EOMI=['었습니다','았습니다','겠습니다','습니다','ㅂ니다','었습니까','았습니까','겠습니까','습니까','ㅂ니까','었으면','았으면','었지만','았지만','었는데','았는데','겠지만','겠는데','겠어요','겠어','었어요','았어요','었어','았어','어요','아요','지요','죠','었다','았다','겠다','는다','ㄴ다','으면','면','지만','는데','ㄴ데','어서','아서','어도','아도','으며','며','으니','니','으나','나','어','아','지','고','서'];
function split(w){for(const j of JOSA)if(w.length>j.length&&w.endsWith(j))return{stem:w.slice(0,-j.length),sfx:j};for(const e of EOMI)if(w.length>e.length&&w.endsWith(e))return{stem:w.slice(0,-e.length),sfx:e};return{stem:w,sfx:''};}
function tokenize(text){const r=[];const re=/([가-힣a-zA-Z0-9]+)|([^가-힣a-zA-Z0-9])/g;let m;while((m=re.exec(text))!==null){if(m[1]){const{stem,sfx}=split(m[1]);r.push({t:'w',w:m[1],stem,sfx});}else r.push({t:'p',v:m[2]});}return r;}

function switchTab(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&tab==='input')||(i===1&&tab==='read')));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
}

function analyzeText(){
  const text=document.getElementById('textInput').value.trim();
  if(!text)return;
  renderText(text); switchTab('read');
}

function renderText(text){
  const cont=document.getElementById('readingText'); cont.innerHTML='';
  let total=0;
  tokenize(text).forEach(tok=>{
    if(tok.t==='p'){cont.appendChild(tok.v==='\n'?document.createElement('br'):document.createTextNode(tok.v));return;}
    total++;
    const sp=document.createElement('span');
    sp.className='word-token grade-loading'; sp.textContent=tok.stem;
    sp.dataset.stem=tok.stem;
    sp.title=tok.sfx?`${tok.stem} + ${tok.sfx}`:tok.stem;
    sp.onclick=e=>{e.stopPropagation();onClick(tok.stem,e);};
    cont.appendChild(sp);
    if(tok.sfx){const js=document.createElement('span');js.className='josa';js.textContent=tok.sfx;cont.appendChild(js);}
  });
  document.getElementById('s-total').textContent=total;
  ['s-a','s-b','s-c'].forEach(id=>document.getElementById(id).textContent='—');
  batchGrades(cont);
}

async function batchGrades(cont){
  const spans=[...cont.querySelectorAll('.word-token')];
  const stems=[...new Set(spans.map(s=>s.dataset.stem).filter(Boolean))];
  let cA=0,cB=0,cC=0;
  for(let i=0;i<stems.length;i++){
    const stem=stems[i],info=await fetchDict(stem);
    cont.querySelectorAll(`.word-token[data-stem="${CSS.escape(stem)}"]`).forEach(sp=>{
      sp.classList.remove('grade-loading');
      sp.classList.add(info?.grade?'grade-'+info.grade:'grade-unknown');
    });
    if(info?.grade==='초급')cA++; else if(info?.grade==='중급')cB++; else if(info?.grade==='고급')cC++;
    if(i%20===19){document.getElementById('s-a').textContent=cA;document.getElementById('s-b').textContent=cB;document.getElementById('s-c').textContent=cC;await new Promise(r=>setTimeout(r,10));}
  }
  document.getElementById('s-a').textContent=cA;document.getElementById('s-b').textContent=cB;document.getElementById('s-c').textContent=cC;
}

let hl=null;
async function onClick(stem,e){
  if(hl)hl.classList.remove('hl'); hl=e.target; hl.classList.add('hl');
  const popup=document.getElementById('popup');
  document.getElementById('p-word').textContent=stem;
  document.getElementById('p-grade').textContent='조회 중';
  document.getElementById('p-grade').className='popup-grade g-loading';
  document.getElementById('p-pos').textContent='';
  document.getElementById('p-body').innerHTML='<span class="spinner"></span>';
  popup.style.display='block'; posPopup(e);
  const info=await fetchDict(stem);
  if(info&&info.senses?.length){
    document.getElementById('p-grade').textContent=info.grade||'—';
    document.getElementById('p-grade').className='popup-grade g-'+(info.grade||'unknown');
    document.getElementById('p-pos').textContent=info.pos;
    const body=document.getElementById('p-body'); body.innerHTML='';
    info.senses.slice(0,3).forEach((s,i)=>{
      const d=document.createElement('div'); d.className='sense';
      if(info.senses.length>1){const n=document.createElement('div');n.className='sense-n';n.textContent=`${i+1}.`;d.appendChild(n);}
      const def=document.createElement('div');def.className='sense-def';def.textContent=s.def;d.appendChild(def);
      if(s.ex){const ex=document.createElement('div');ex.className='sense-ex';ex.textContent=s.ex;d.appendChild(ex);}
      body.appendChild(d);
    });
  } else {
    document.getElementById('p-grade').textContent='미등록';
    document.getElementById('p-grade').className='popup-grade g-unknown';
    document.getElementById('p-pos').textContent='';
    document.getElementById('p-body').textContent=`"${stem}"은 사전에 등록되지 않은 단어예요.`;
  }
  posPopup(e);
}

function posPopup(e){
  const p=document.getElementById('popup'),r=e.target.getBoundingClientRect();
  let left=r.left+window.scrollX, top=r.bottom+window.scrollY+8;
  if(left+330>window.innerWidth)left=window.innerWidth-335;
  if(top+260>window.innerHeight+window.scrollY)top=r.top+window.scrollY-270;
  p.style.left=left+'px'; p.style.top=top+'px';
}
function closePopup(){document.getElementById('popup').style.display='none';if(hl){hl.classList.remove('hl');hl=null;}}
document.addEventListener('click',e=>{if(!e.target.closest('#popup')&&!e.target.classList.contains('word-token'))closePopup();});

const gradeOn={a:true,b:true,c:true};
function toggleGrade(k,cls){
  gradeOn[k]=!gradeOn[k];
  document.getElementById('tg-'+k).classList.toggle('on-'+k,gradeOn[k]);
  document.querySelectorAll('.word-token.grade-'+cls).forEach(el=>{el.style.borderBottom=gradeOn[k]?'':'none';});
}

document.getElementById('fileInput').addEventListener('change',async e=>{
  const file=e.target.files[0]; if(!file)return;
  if(file.type==='application/pdf'){
    const reader=new FileReader();
    reader.onload=async ev=>{
      const pdf=await pdfjsLib.getDocument(new Uint8Array(ev.target.result)).promise;
      let text='';
      for(let i=1;i<=Math.min(pdf.numPages,30);i++){const page=await pdf.getPage(i),tc=await page.getTextContent();text+=tc.items.map(it=>it.str).join(' ')+'\n\n';}
      document.getElementById('textInput').value=text.trim(); switchTab('input');
    };
    reader.readAsArrayBuffer(file);
  } else {
    const reader=new FileReader();
    reader.onload=ev=>{document.getElementById('textInput').value=ev.target.result;switchTab('input');};
    reader.readAsText(file,'UTF-8');
  }
});
</script>
